name: Build Windows Kiosk

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    # windows-2022 ships VS 2022 (v17) — Flutter maps it to the right CMake
    # generator. windows-latest now has VS 2026 (v18) which Flutter can't target.
    runs-on: windows-2022
    env:
      CODESIGN_PFX_B64: ${{ secrets.CODESIGN_PFX_B64 }}
      CODESIGN_PW: ${{ secrets.CODESIGN_PW }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Pub get
        run: flutter pub get

      - name: Build Windows (release)
        run: flutter build windows --release

      # MSVCP140.dll xatosi (toza Windows'da VC++ runtime yo'q) — kerakli DLL'lar
      # exe yoniga qo'shiladi, foydalanuvchi hech narsa o'rnatmaydi.
      - name: Bundle VC++ runtime DLLs
        shell: pwsh
        run: |
          $dst = "build/windows/x64/runner/Release"
          foreach ($d in @('msvcp140.dll','vcruntime140.dll','vcruntime140_1.dll','msvcp140_1.dll','msvcp140_2.dll','msvcp140_atomic_wait.dll')) {
            $src = "C:\Windows\System32\$d"
            if (Test-Path $src) { Copy-Item $src $dst -Force; Write-Host "qo'shildi: $d" }
          }

      # --- KOD IMZOLASH (self-signed) — "noshiri tasdiqlanmadi" ogohlantirishini yo'qotadi ---
      # Sertifikat repo secret'ida (CODESIGN_PFX_B64 + CODESIGN_PW). Bo'lmasa imzosiz quriladi.
      - name: Decode signing certificate
        if: env.CODESIGN_PFX_B64 != ''
        shell: pwsh
        run: |
          [System.IO.File]::WriteAllBytes("$env:RUNNER_TEMP\codesign.pfx", [System.Convert]::FromBase64String($env:CODESIGN_PFX_B64))
          $st = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue | Sort-Object FullName | Select-Object -Last 1
          if (-not $st) { $st = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\x64\signtool.exe" -ErrorAction SilentlyContinue | Select-Object -Last 1 }
          "SIGNTOOL=$($st.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "signtool: $($st.FullName)"

      - name: Sign app executable
        if: env.CODESIGN_PFX_B64 != ''
        shell: pwsh
        run: |
          $exe = "build\windows\x64\runner\Release\kadastr_kiosk.exe"
          & "$env:SIGNTOOL" sign /f "$env:RUNNER_TEMP\codesign.pfx" /p "$env:CODESIGN_PW" /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /d "Kadastr Kiosk" $exe
          if ($LASTEXITCODE -ne 0) { throw "signtool app exe imzolamadi ($LASTEXITCODE)" }
          # verify /pa RUNNERда o'tmaydi (self-signed ildiz runner'да ishonchli emas) — bu normal;
          # kioskда sertifikat o'rnatilgach ishonchli bo'ladi. Imzo qo'yildi (yuqorida "Successfully signed").

      - name: Zip release bundle (portable)
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath kadastr-kiosk-windows.zip

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer (Setup.exe)
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\kiosk.iss'

      - name: Sign installer
        if: env.CODESIGN_PFX_B64 != ''
        shell: pwsh
        run: |
          $inst = "installer_out\kadastr-kiosk-setup.exe"
          & "$env:SIGNTOOL" sign /f "$env:RUNNER_TEMP\codesign.pfx" /p "$env:CODESIGN_PW" /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /d "Kadastr Kiosk Setup" $inst
          if ($LASTEXITCODE -ne 0) { throw "signtool installer imzolamadi ($LASTEXITCODE)" }
          # verify /pa RUNNERда o'tmaydi (self-signed) — normal; imzo qo'yildi.

      - name: Upload portable zip
        uses: actions/upload-artifact@v4
        with:
          name: kadastr-kiosk-windows
          path: kadastr-kiosk-windows.zip
          retention-days: 30

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: kadastr-kiosk-setup
          path: installer_out/kadastr-kiosk-setup.exe
          retention-days: 30
